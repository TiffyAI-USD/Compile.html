<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralive | Website-to-HTML Compiler</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(51, 65, 85, 0.8);
            --accent-glow: rgba(56, 189, 248, 0.3);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Background image with a dark overlay gradient for readability */
            background: linear-gradient(rgba(9, 13, 22, 0.75), rgba(21, 27, 43, 0.85)), url('set.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .compiler-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 19px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 6px;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 16px;
            background: var(--gold-gradient);
            color: #000;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(191, 149, 63, 0.3);
        }

        .action-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        #statusLog {
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="compiler-container">
        <h2>Decentralive Compiler</h2>
        <p class="subtitle">Crawl any web URL and package it into a platform-ready HTML asset.</p>
        
        <div class="input-group">
            <label for="targetUrlInput">Target Website URL</label>
            <input type="text" id="targetUrlInput" placeholder="https://example.com" />
        </div>

        <div class="input-group">
            <label for="businessNameInput">Business Identifier Name</label>
            <input type="text" id="businessNameInput" placeholder="e.g. acme-corp" />
        </div>

        <button class="action-btn" id="scrapeBtn" onclick="handleScrapeTrigger()">Compile to Platform HTML</button>
        
        <div id="statusLog"></div>
    </div>

    <script>
        async function convertWebsiteToHtml(targetUrl, businessName = "hosted-business") {
            const statusLog = document.getElementById("statusLog");
            
            if (!targetUrl) {
                alert("Please enter a valid website URL.");
                return;
            }

            const safeName = businessName.toLowerCase().replace(/[^a-z0-9]/g, "-");
            const fileName = `${safeName}-site.html`;

            statusLog.style.color = "#38bdf8";
            statusLog.textContent = `Initiating live compilation for ${targetUrl}...`;

            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network response failed to fetch target URL.");
                
                const data = await response.json();
                let rawHtml = data.contents;

                if (!rawHtml) {
                    throw new Error("No HTML content returned from the target source.");
                }

                const injectionTag = `<base href="${targetUrl}">\n\n`;
                rawHtml = rawHtml.replace("<head>", `<head>\n${injectionTag}`);

                const blob = new Blob([rawHtml], { type: "text/html;charset=utf-8" });
                const blobUrl = URL.createObjectURL(blob);

                const downloadLink = document.createElement("a");
                downloadLink.href = blobUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                
                document.body.removeChild(downloadLink);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

                statusLog.style.color = "#34d399";
                statusLog.textContent = `Successfully packaged & downloaded: ${fileName}`;

            } catch (error) {
                console.error("Scraping execution error:", error);
                statusLog.style.color = "#f87171";
                statusLog.textContent = `Compilation error. Check security restrictions or URL syntax.`;
            }
        }

        function handleScrapeTrigger() {
            const url = document.getElementById("targetUrlInput").value.trim();
            const name = document.getElementById("businessNameInput").value.trim() || "business";
            convertWebsiteToHtml(url, name);
        }
    </script>
</body>
</html>
